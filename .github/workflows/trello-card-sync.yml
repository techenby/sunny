name: Trello Card Sync

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

jobs:
  move-card:
    runs-on: ubuntu-latest

    steps:
      - name: Move the PR's Trello cards
        uses: actions/github-script@v9
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        with:
          script: |
            const { TRELLO_API_KEY: key, TRELLO_TOKEN: token } = process.env;

            if (! key || ! token) {
              core.warning('TRELLO_API_KEY or TRELLO_TOKEN is not set, so no Trello card was moved.');
              return;
            }

            const lists = {
              doing: { id: '6afdfbaba1a2e3329e01d249', name: 'Doing' },
              agentReview: { id: '6afdfbe9d98eecba0a4b8cc0', name: 'Agent Review' },
              humanReview: { id: '6afdfbee699beb7b421d842d', name: 'Human Review' },
              readyToShip: { id: '6afdfc02ad9f6d062af75b1d', name: 'Ready to 🚀' },
              done: { id: '6afdfbaba1a2e3329e01d24a', name: 'Done' },
            };
            const order = [lists.doing, lists.agentReview, lists.humanReview, lists.readyToShip, lists.done].map((list) => list.id);

            const pr = context.payload.pull_request;
            const action = context.payload.action;

            let target;

            if (action === 'closed') {
              if (! pr.merged) {
                return;
              }
              target = lists.readyToShip;
            } else if (action === 'converted_to_draft' || pr.draft) {
              target = lists.doing;
            } else {
              target = lists.agentReview;
            }

            const shortLinks = [...new Set([...(pr.body ?? '').matchAll(/trello\.com\/c\/([A-Za-z0-9]+)/g)].map((match) => match[1]))];

            if (shortLinks.length === 0) {
              core.notice('The PR description has no Trello card link, so no card was moved.');
              return;
            }

            const trello = async (method, path, params = {}) => {
              const query = new URLSearchParams({ ...params, key, token });
              const response = await fetch(`https://api.trello.com/1/${path}?${query}`, { method });

              if (! response.ok) {
                throw new Error(`Trello ${method} ${path} failed: ${response.status} ${await response.text()}`);
              }

              return response.json();
            };

            for (const shortLink of shortLinks) {
              const card = await trello('GET', `cards/${shortLink}`, { fields: 'name,idList' });

              if (card.idList === target.id) {
                core.info(`"${card.name}" is already in ${target.name}.`);
                continue;
              }

              const movingBack = order.indexOf(card.idList) > order.indexOf(target.id);

              if (movingBack && action !== 'converted_to_draft') {
                core.info(`"${card.name}" is further along than ${target.name}, so it stays where it is.`);
                continue;
              }

              await trello('PUT', `cards/${card.id}`, { idList: target.id, pos: 'top' });
              core.info(`Moved "${card.name}" to ${target.name}.`);
            }
